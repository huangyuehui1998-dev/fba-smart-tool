# Windows onedir zip for FBA Smart Tool V4.
# Download and Release steps: docs/delivery/PORTABLE_WINDOWS_CI.md
# This workflow uploads an Actions artifact only. It does not create a GitHub Release.
# Third-party actions are pinned to full commit SHAs. The comment is the release
# tag that SHA resolved to. Do not switch these back to floating @vN tags.

name: Portable Windows package

# workflow_dispatch and v4* tag pushes are unconditional.
# GitHub does not evaluate path filters on tag pushes; do not put paths under push.
# pull_request cannot set both paths and paths-ignore. Positive paths limit the
# run to packaging inputs. The ! patterns are the inverse (paths-ignore equivalent)
# for docs/**, *.md, and review/**, and must stay after the positive patterns.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "run_app.py"
      - "scripts/build_standalone.ps1"
      - "scripts/check_spreadsheet_deps.py"
      - "scripts/finish_portable_dist.py"
      - "scripts/generate_qiluo_template.py"
      - "scripts/release_guard.py"
      - "scripts/sync_frontend_static.py"
      - "scripts/verify_bundled_resources.py"
      - "scripts/verify_release_dist.py"
      - ".github/workflows/portable-windows.yml"
      - "!docs/**"
      - "!*.md"
      - "!**/*.md"
      - "!review/**"
  push:
    tags:
      - "v4*"

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build V4 portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # So a manual rerun of a tagged commit can still fill git_tag via describe.
          fetch-tags: true

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            packaging/requirements-pyinstaller.txt

      - name: Create backend venv and install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv backend\.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & backend\.venv\Scripts\python.exe -m pip install -r backend\requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Forbid browser spreadsheet parsers
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & backend\.venv\Scripts\python.exe scripts\check_spreadsheet_deps.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PYINSTALLER_CONFIG_DIR = Join-Path (Get-Location) "build\pyinstaller-config"
          New-Item -ItemType Directory -Force -Path $env:PYINSTALLER_CONFIG_DIR | Out-Null
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          # finish_portable_dist.py writes FBA_Smart_Tool/BUILDINFO.txt from these
          # toolchain versions plus GITHUB_SHA, GITHUB_RUN_ID, and the tag ref.
          $nodeVer = & node.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUILDINFO_NODE_VERSION = "$nodeVer".Trim()
          $pyver = & backend\.venv\Scripts\python.exe -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BUILDINFO_PYTHON_VERSION = "$pyver".Trim()
          Write-Host "BUILDINFO_NODE_VERSION=$env:BUILDINFO_NODE_VERSION"
          Write-Host "BUILDINFO_PYTHON_VERSION=$env:BUILDINFO_PYTHON_VERSION"
          & .\scripts\build_standalone.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Univer hyphen chunks
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path "frontend\dist\client\assets" -File -ErrorAction Stop
          $hyphen = @($assets | Where-Object { $_.Name -match '(^|-)(af|as|be|bg|bn|ca|cop|cs|cu|cy|da|de-1901|de-1996|de-ch|el-monoton|el-polyton|en-gb|es|et|eu|fi|fr|hu|hy|lt|lv|nb|nl|nn|pl|pt|ro|ru|sk|sl|sr|sv|tr|uk|zh-latn-pinyin|univer-hyphen-stub)(-|\.)' })
          Write-Host ("hyphen-like chunks: " + $hyphen.Count)
          if ($hyphen.Count -ge 70) { throw "too many hyphen locale chunks: $($hyphen.Count)" }

      - name: Upload portable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FBA_Smart_Tool_V4_便携版.zip
          path: dist/FBA_Smart_Tool_V4_便携版.zip
          if-no-files-found: error
          retention-days: 30
          # The zip is already compressed. Store it as-is so the inner UTF-8 names are not rebuilt.
          compression-level: 0

      - name: Record SHA256
        shell: pwsh
        run: |
          $zip = Get-Item -LiteralPath "dist\FBA_Smart_Tool_V4_便携版.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLower()
          $infoPath = "dist\FBA_Smart_Tool\BUILDINFO.txt"
          if (-not (Test-Path -LiteralPath $infoPath)) { throw "BUILDINFO.txt missing from portable folder" }
          $info = Get-Content -LiteralPath $infoPath -Raw -Encoding utf8
          $fence = '```'
          @"
          ## Portable package

          - Artifact: ``FBA_Smart_Tool_V4_便携版.zip``
          - File: ``$($zip.Name)``
          - Size: $($zip.Length) bytes
          - SHA256: ``$hash``

          The download is wrapped in an outer zip. Unzip once and attach the inner file to a Release. Do not re-pack it.

          ### BUILDINFO

          "@ + $fence + "`n" + $info.TrimEnd() + "`n" + $fence + "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "SHA256 $hash"
          Write-Host $info
