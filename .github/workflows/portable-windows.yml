# Windows onedir zip for FBA Smart Tool V3.3.
# Download and Release steps: docs/delivery/PORTABLE_WINDOWS_CI.md
# This workflow uploads an Actions artifact only. It does not create a GitHub Release.

name: Portable Windows package

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v3.3*"

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build V3.3 portable zip
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            packaging/requirements-pyinstaller.txt

      - name: Create backend venv and install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv backend\.venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & backend\.venv\Scripts\python.exe -m pip install -r backend\requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PYINSTALLER_CONFIG_DIR = Join-Path (Get-Location) "build\pyinstaller-config"
          New-Item -ItemType Directory -Force -Path $env:PYINSTALLER_CONFIG_DIR | Out-Null
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & .\scripts\build_standalone.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: FBA_Smart_Tool_V3.3_便携版.zip
          path: dist/FBA_Smart_Tool_V3.3_便携版.zip
          if-no-files-found: error
          retention-days: 30
          # The zip is already compressed. Store it as-is so the inner UTF-8 names are not rebuilt.
          compression-level: 0

      - name: Record SHA256
        shell: pwsh
        run: |
          $zip = Get-Item -LiteralPath "dist\FBA_Smart_Tool_V3.3_便携版.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLower()
          @"
          ## Portable package

          - Artifact: ``FBA_Smart_Tool_V3.3_便携版.zip``
          - File: ``$($zip.Name)``
          - Size: $($zip.Length) bytes
          - SHA256: ``$hash``

          The download is wrapped in an outer zip. Unzip once and attach the inner file to a Release. Do not re-pack it.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "SHA256 $hash"
